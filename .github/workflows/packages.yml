name: Development package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'assets/**'
      - 'go.mod'
      - 'go.sum'
      - 'viva.toml'
      - 'scripts/package*.sh'
      - '.github/workflows/packages.yml'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'assets/**'
      - 'go.mod'
      - 'go.sum'
      - 'viva.toml'
      - 'scripts/package*.sh'
      - '.github/workflows/packages.yml'

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - name: Test M4 natively and with the Driver
        run: |
          state=$(mktemp -d)
          trap 'rm -rf -- "$state"' EXIT
          state_path="$state"
          if [[ "$RUNNER_OS" == Windows ]]; then state_path=$(cygpath -aw "$state"); fi
          export MARKSTACK_RECOVERY_PATH="$state_path/recovery.json"
          export MARKSTACK_SESSION_PATH="$state_path/session.json"
          export MARKSTACK_SETTINGS_PATH="$state_path/settings.json"
          export MARKSTACK_RECENT_PATH="$state_path/recent.json"
          go mod verify
          go test ./internal/mathrender ./internal/diagramrender ./internal/markdownedit ./internal/exporthtml ./internal/exportpdf -count=1
          go test ./internal/workspace -run 'Test(RenameFolder|WindowsRename|LinuxTrash)' -count=1
          go test ./cmd/markstack -run '^TestTechnicalDriver' -count=1
          go test -tags vivahead ./cmd/markstack -run '^TestTechnicalDriver' -count=1

  macos:
    name: Unsigned macOS development package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - name: Verify and package the current dependency set
        run: |
          go mod verify
          bash scripts/package.sh --no-sign
          ditto -c -k --sequesterRsrc --keepParent build/MarkStack.app build/MarkStack-macos-unsigned.zip
          (
            cd build
            shasum -a 256 MarkStack-macos-unsigned.zip > SHA256SUMS
            shasum -a 256 --check SHA256SUMS
          )
          go version > build/build-info.txt
          go list -m all >> build/build-info.txt
          git rev-parse HEAD >> build/build-info.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MarkStack-macos-unsigned-${{ github.sha }}
          path: |
            build/MarkStack-macos-unsigned.zip
            build/SHA256SUMS
            build/build-info.txt
          retention-days: 7
          if-no-files-found: error

  linux:
    name: Unsigned Linux development package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - name: Build and verify the Debian package
        run: |
          go mod verify
          bash scripts/package-linux.sh --no-sign amd64
          packages=(build/*.deb)
          [[ ${#packages[@]} == 1 ]]
          dpkg-deb --fsys-tarfile "${packages[0]}" | tar -xOf - ./usr/share/doc/markstack/copyright > build/package-notices.txt
          grep -q 'SIL OPEN FONT LICENSE' build/package-notices.txt
          grep -q 'Lucide icons' build/package-notices.txt
          (cd build && sha256sum ./*.deb > SHA256SUMS && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MarkStack-linux-amd64-${{ github.sha }}
          path: |
            build/*.deb
            build/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Unsigned Windows development packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - name: Install NSIS packaging tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis
      - name: Build installer and verify portable bundle
        run: |
          go mod verify
          bash scripts/package-windows.sh --no-sign amd64
          bundles=(build/*windows-amd64.zip)
          installers=(build/*windows-amd64-setup.exe)
          [[ ${#bundles[@]} == 1 && -s ${bundles[0]} && ${#installers[@]} == 1 && -s ${installers[0]} ]]
          unzip -t "${bundles[0]}"
          unzip -p "${bundles[0]}" '*PDF-Font-OFL.txt' | cmp - internal/exportpdf/font/OFL.txt
          unzip -p "${bundles[0]}" '*Lucide-LICENSE.txt' | cmp - assets/lucide/LICENSE
          (cd build && sha256sum ./*windows-amd64.zip ./*windows-amd64-setup.exe > SHA256SUMS && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MarkStack-windows-amd64-${{ github.sha }}
          path: |
            build/*windows-amd64.zip
            build/*windows-amd64-setup.exe
            build/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
