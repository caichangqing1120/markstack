name: MarkStack release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: markstack-stable-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  native-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - name: Verify updater and settings on the host
        run: |
          go test ./internal/updater -count=1
          go test -tags vivahead ./cmd/markstack -run '^TestM6Driver' -count=1

  packages:
    strategy:
      fail-fast: false
      matrix:
        target: [darwin, windows, linux]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.target == 'darwin' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - name: Install Windows packaging tools
        if: matrix.target == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis osslsigncode
      - name: Build package
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          MARKSTACK_UPDATE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          MARKSTACK_UPDATE_PUBLIC_KEY: ${{ vars.MARKSTACK_UPDATE_PUBLIC_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.target == 'darwin' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_CERTIFICATE: ${{ matrix.target == 'darwin' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.target == 'darwin' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ matrix.target == 'darwin' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ matrix.target == 'darwin' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.target == 'darwin' && secrets.APPLE_API_ISSUER || '' }}
          WINDOWS_CERTIFICATE: ${{ matrix.target == 'windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ matrix.target == 'windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ matrix.target == 'windows' && vars.WINDOWS_TIMESTAMP_URL || '' }}
        run: |
          go mod verify
          if [[ "$TARGET" == darwin ]]; then
            : "${APPLE_API_KEY_P8:?configure the Apple notarization key}"
            umask 077
            export APPLE_API_KEY="$RUNNER_TEMP/markstack-notary.p8"
            trap 'rm -f -- "$APPLE_API_KEY"' EXIT
            printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
            unset APPLE_API_KEY_P8
          fi
          bash scripts/build-release-package.sh "$TARGET" "$ARCH" "$GITHUB_REF_NAME" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.exe
          if-no-files-found: error

  publish:
    needs: [packages, native-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Sign and verify the update feed
        env:
          GH_TOKEN: ${{ github.token }}
          VIVA_UPDATE_KEY: ${{ secrets.VIVA_UPDATE_KEY }}
          MARKSTACK_UPDATE_PUBLIC_KEY: ${{ vars.MARKSTACK_UPDATE_PUBLIC_KEY }}
        run: |
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')
          patches=()
          if [[ -n "$previous" ]]; then
            [[ "$previous" != "$GITHUB_REF_NAME" ]]
            if [[ "$previous" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              [[ $(printf '%s\n' "$previous" "$GITHUB_REF_NAME" | sort -V | tail -n1) == "$GITHUB_REF_NAME" ]]
              names=$(gh release view "$previous" --json assets --jq '.assets[].name')
              mkdir previous
              for arch in amd64 arm64; do
                for target in darwin windows linux; do
                  extension=zip
                  if [[ "$target" == linux ]]; then extension=tar.gz; fi
                  name="markstack-${previous#v}-$target-$arch.$extension"
                  if printf '%s\n' "$names" | rg -Fxq -- "$name"; then
                    gh release download "$previous" --pattern "$name" --dir previous
                    patches+=("$target/$arch=${previous#v}=$PWD/previous/$name")
                  fi
                done
              done
            fi
          fi
          bash scripts/build-update-feed.sh "$GITHUB_REF_NAME" dist \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" "${patches[@]}"
      - name: Publish verified assets on the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest --generate-notes
