name: Issue commands

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  commands:
    name: Handle the comment
    if: >-
      ${{ !github.event.issue.pull_request && github.event.comment.user.type != 'Bot' &&
          (contains(github.event.comment.body, '/claim') ||
           contains(github.event.comment.body, '/unclaim') ||
           contains(github.event.comment.body, '/close')) }}
    concurrency:
      group: issue-commands-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Create an optional dedicated bot token
        id: bot-token
        if: ${{ vars.MARKSTACK_BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          app-id: ${{ vars.MARKSTACK_BOT_APP_ID }}
          private-key: ${{ secrets.MARKSTACK_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: read
      - name: Apply the issue command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ steps.bot-token.outputs.token || github.token }}
          script: |
            const { handleIssueCommand } = require('./.github/scripts/issue-commands.cjs');
            await handleIssueCommand({ github, context });
